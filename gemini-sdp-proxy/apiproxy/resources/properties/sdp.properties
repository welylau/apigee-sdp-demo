# Proxy-scoped property set "sdp" (read as propertyset.sdp.<key>).
# Change project, region, templates or model here instead of editing policies/JS.

# Sensitive Data Protection (Cloud DLP)
dlp_project=YOUR_GCP_PROJECT_ID
dlp_location=asia-southeast1
# v2 templates (see dlp/*.json, created by setup-dlp-templates.sh). To roll back use:
#   inspect_template=projects/YOUR_GCP_PROJECT_ID/locations/asia-southeast1/inspectTemplates/inspect-sensitve
#   deidentify_template=projects/YOUR_GCP_PROJECT_ID/locations/asia-southeast1/deidentifyTemplates/deidentify-sensitve
inspect_template=projects/YOUR_GCP_PROJECT_ID/locations/asia-southeast1/inspectTemplates/inspect-sensitive-v2
deidentify_template=projects/YOUR_GCP_PROJECT_ID/locations/asia-southeast1/deidentifyTemplates/deidentify-sensitive-v2

# Vertex AI Gemini backend
vertex_host=aiplatform.googleapis.com
vertex_project=YOUR_GCP_PROJECT_ID
vertex_location=global
model=gemini-3.5-flash-lite
